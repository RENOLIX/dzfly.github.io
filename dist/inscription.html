<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082a54">
  <meta name="robots" content="noindex,nofollow">
  <title>Créer un compte — DZ FLY</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="account.css?v=20261111-stable">
</head>
<body class="account-page" data-page="inscription">
  <main class="account-layout">
    <aside class="account-cover" aria-label="DZ FLY">
      <a class="account-brand" href="index.html" aria-label="DZ FLY — Accueil"><img src="assets/logo-original.png" alt="DZ FLY" width="1448" height="1086"></a>
      <p class="account-slogan"><span data-copy="sloganOrigin">Une marque algérienne,</span> <em data-copy="sloganAmbition">une ambition internationale.</em></p>
    </aside>
    <section class="account-surface" aria-labelledby="account-title">
      <a class="account-back" href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="assets/lucide-drawer.svg?v=20261110-compte#chevron-right"/></svg><span data-copy="back">Retour à l’accueil</span></a>
      <div class="account-inner">
        <nav class="account-tabs" aria-label="Espace voyageur">
          <a href="connexion.html?v=20261111-stable"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="assets/lucide-drawer.svg?v=20261111-tabs#log-in"/></svg><span data-copy="login">Connexion</span></a>
          <a href="inscription.html?v=20261111-stable" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="assets/lucide-drawer.svg?v=20261111-tabs#user-round-plus"/></svg><span data-copy="register">Inscription</span></a>
        </nav>
        <h1 id="account-title" data-copy="signupTitle">Créer un compte</h1>
        <p class="account-lead" data-copy="signupLead">Un espace pour retrouver vos itinéraires et préparer vos prochains voyages.</p>
        <form class="account-form" aria-describedby="account-preview">
          <fieldset disabled>
            <div class="account-name-row">
              <div class="account-name-field">
                <label for="account-last-name" data-copy="lastName">Nom</label>
                <input id="account-last-name" type="text" autocomplete="family-name" placeholder="Votre nom" data-placeholder="lastNamePlaceholder">
              </div>
              <div class="account-name-field">
                <label for="account-first-name" data-copy="firstName">Prénom</label>
                <input id="account-first-name" type="text" autocomplete="given-name" placeholder="Votre prénom" data-placeholder="firstNamePlaceholder">
              </div>
            </div>
            <label for="account-email" data-copy="email">Adresse e-mail</label>
            <input id="account-email" type="email" autocomplete="email" placeholder="vous@exemple.com">
            <label for="account-phone" data-copy="phone">Numéro de téléphone</label>
            <div class="account-phone" dir="ltr">
              <span id="account-phone-prefix">+213</span>
              <input id="account-phone" type="tel" autocomplete="tel-national" aria-describedby="account-phone-prefix" placeholder="5 55 55 55 55">
            </div>
            <label for="account-password" data-copy="password">Mot de passe</label>
            <input id="account-password" type="password" autocomplete="new-password" placeholder="••••••••••">
          </fieldset>
          <div class="account-cta-row">
            <button class="account-submit account-submit-compact" type="button" disabled aria-describedby="account-preview"><span data-copy="signupTitle">Créer un compte</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="assets/lucide-drawer.svg?v=20261110-compte#chevron-right"/></svg></button>
          </div>
          <p class="account-preview" id="account-preview"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="assets/lucide-drawer.svg?v=20261110-compte#circle-help"/></svg><span data-copy="signupClosed">Les inscriptions ne sont pas encore ouvertes.</span></p>
        </form>
        <p class="account-alternate"><span data-copy="already">Déjà un compte ?</span> <a href="connexion.html?v=20261111-stable" data-copy="submitLogin">Se connecter</a></p>
      </div>
    </section>
  </main>
  <script type="module" src="account-theme.mjs?v=20261111-tabs"></script>
</body>
</html>
